name: microfrontends-lab-registry

services:
  verdaccio:
    image: verdaccio/verdaccio:6.10.3
    container_name: microfrontends-lab-verdaccio
    ports:
      - '127.0.0.1:4873:4873'
    volumes:
      - './config.yaml:/verdaccio/conf/config.yaml:ro'
      - 'verdaccio-storage:/verdaccio/storage'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4873/-/ping').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  verdaccio-storage:
